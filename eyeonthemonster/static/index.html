<!doctype html>
<meta charset="utf-8">
<title>Eye on the Monster - live report</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root { color-scheme: light; --line:#d7dde5; --soft:#f6f7f9; --ink:#20242a; --muted:#667085; --accent:#1f7a8c; --ok:#287a48; --bar-h:52px; }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; margin: 0; color: var(--ink); background: #fff; }

  /* --- top bar --- */
  #bar { position: sticky; top: 0; z-index: 30; display: flex; gap: .5rem; align-items: center; height: var(--bar-h); padding: 0 1rem; border-bottom: 1px solid var(--line); background: #fff; }
  #q { flex: 1; max-width: 820px; font: inherit; padding: .45rem .6rem; border: 1px solid #b9c2cf; border-radius: 4px; }
  button { font: inherit; padding: .45rem .8rem; border: 1px solid #14576a; background: var(--accent); color: white; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .55; cursor: wait; }
  #toggle { background: #fff; color: var(--accent); border-color: #b9c2cf; margin-left: auto; }

  /* --- report (the hero, full width) --- */
  #report { max-width: 860px; margin: 0 auto; padding: 1.5rem 2rem 6rem; }

  #answer-slot { background: #eef6f8; border: 1px solid #cfe3e8; border-left: 4px solid var(--accent); border-radius: 6px; padding: .85rem 1.1rem; margin: 0 0 1.6rem; }
  .answer-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin-bottom: .3rem; }
  #answer-slot > :last-child { margin-bottom: 0; }

  /* --- sections (U2) --- */
  summary { cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  .section > summary::before, .supporting > summary::before { content: "\25B8\00a0"; color: var(--muted); }
  .section[open] > summary::before, .supporting[open] > summary::before { content: "\25BE\00a0"; }
  .section > summary { font-size: 1.15rem; font-weight: 600; margin: 1.5rem 0 .5rem; padding-bottom: .25rem; border-bottom: 1px solid var(--line); }
  #sections > .section:first-child > summary { margin-top: .2rem; }

  /* --- supporting disclosure (U3) --- */
  .supporting { margin: .5rem 0 .3rem; }
  .supporting[hidden] { display: none; }
  .supporting > summary { color: var(--muted); font-size: 12.5px; }
  .sup-body { padding-left: .7rem; border-left: 2px solid var(--line); margin-top: .45rem; }
  .sup-body blockquote { background: #fafbfc; font-size: 13px; }
  .sup-body figure { display: inline-block; margin: .5rem .6rem .2rem 0; vertical-align: top; }
  .sup-body figure img { max-width: 240px; }

  /* --- findings --- */
  blockquote { border-left: 3px solid var(--accent); margin: .8rem 0; padding: .25rem .9rem; color: #30353d; background: #f8fbfc; }
  blockquote p { margin: .3rem 0; }
  blockquote .cite { display: block; color: var(--accent); font-size: 12px; margin-top: .35rem; }
  figure { margin: 1rem 0; }
  figure img { max-width: 100%; border: 1px solid var(--line); }
  figcaption { font-size: 12px; color: var(--muted); margin-top: .35rem; }

  /* --- trace drawer (U1) --- */
  #trace { position: fixed; top: var(--bar-h); right: 0; bottom: 0; width: min(420px, 100%); background: var(--soft); border-left: 1px solid var(--line); padding: .9rem; overflow: auto; font-size: 12px; transform: translateX(100%); transition: transform .18s ease; box-shadow: -8px 0 24px rgba(0,0,0,.07); z-index: 20; }
  body.trace-open #trace { transform: translateX(0); }
  .ev { border-left: 3px solid #b6beca; padding: .35rem .6rem; margin: .45rem 0; background: #fff; overflow-wrap: anywhere; }
  .ev :first-child { margin-top: 0; }
  .ev :last-child { margin-bottom: 0; }
  .tool_call { border-color: var(--accent); }
  .tool_result { border-color: var(--ok); }
  .thought { color: var(--muted); background: transparent; }
  .error { border-color: #b42318; color: #b42318; }
  .ev.flash { animation: flash 1.2s ease; }
  @keyframes flash { from { background: #fff3cd; } to { background: #fff; } }

  @media (max-width: 760px) {
    #report { padding: 1rem 1rem 5rem; }
    #trace { width: 100%; }
  }
</style>

<div id="bar">
  <input id="q" placeholder="Ask about the corpus">
  <button id="run" onclick="go()">Run</button>
  <button id="toggle" aria-expanded="false">Agent trace &#9656;</button>
</div>

<div id="report"></div>
<div id="trace"></div>

<script>
const $ = id => document.getElementById(id);
let current = null;

/* ---------- trace drawer (U1) ---------- */
function setTrace(open) {
  document.body.classList.toggle('trace-open', open);
  $('toggle').innerHTML = 'Agent trace ' + (open ? '▾' : '▸');
  $('toggle').setAttribute('aria-expanded', open);
  localStorage.setItem('traceOpen', open ? '1' : '0');
}
$('toggle').onclick = () => setTrace(!document.body.classList.contains('trace-open'));
setTrace(localStorage.getItem('traceOpen') === '1');  // collapsed by default

/* ---------- report structure (U2 / U3) ---------- */
let answerSlot, sectionsEl, currentSection;

function resetReport() {
  $('report').innerHTML = '';
  answerSlot = document.createElement('div');
  answerSlot.id = 'answer-slot';
  answerSlot.hidden = true;
  sectionsEl = document.createElement('div');
  sectionsEl.id = 'sections';
  $('report').append(answerSlot, sectionsEl);
  currentSection = null;
}

function newSection(title) {
  const sec = document.createElement('details');
  sec.className = 'section';
  sec.open = true;

  const sum = document.createElement('summary');
  sum.innerHTML = title ? marked.parseInline(title) : 'Findings';
  const primary = document.createElement('div');
  primary.className = 'primary';

  const sup = document.createElement('details');
  sup.className = 'supporting';
  sup.hidden = true;
  const supSum = document.createElement('summary');
  const supBody = document.createElement('div');
  supBody.className = 'sup-body';
  sup.append(supSum, supBody);

  sec.append(sum, primary, sup);
  sectionsEl.appendChild(sec);

  sec._primary = primary;
  sec._sup = sup;
  sec._supBody = supBody;
  sec._supSummary = supSum;
  sec._supCount = 0;
  return sec;
}

function ensureSection() {
  if (!currentSection) currentSection = newSection(null);
  return currentSection;
}

function findingHtml(ev) {
  if (ev.kind === 'quote') {
    const cite = `${ev.title || ''}${ev.issue_date ? ', ' + ev.issue_date : ''} [p. ${ev.page}]`;
    return `<blockquote>${marked.parse(ev.text || '')}<span class="cite">${cite}</span></blockquote>`;
  }
  if (ev.kind === 'chart') {
    return `<figure><img src="/page_image/${ev.page}" loading="lazy"><figcaption>${ev.caption || ''} [p. ${ev.page}]</figcaption></figure>`;
  }
  return marked.parse(ev.text || '');  // narrative
}

function addFinding(ev) {
  const sec = ensureSection();
  const node = document.createElement('div');
  node.innerHTML = findingHtml(ev);
  if (ev.src) node.dataset.src = ev.src;  // provenance hook (U4)

  const supporting = (ev.kind === 'quote' || ev.kind === 'chart') && ev.relevance === 'supporting';
  if (supporting) {
    sec._supBody.appendChild(node);
    sec._supCount++;
    sec._supSummary.textContent = `${sec._supCount} supporting finding${sec._supCount === 1 ? '' : 's'}`;
    sec._sup.hidden = false;
  } else {
    sec._primary.appendChild(node);
  }
  followIfSticking();
}

function showAnswer(ev) {
  answerSlot.innerHTML = '<div class="answer-label">Answer</div>' + marked.parse(ev.text || '');
  answerSlot.hidden = false;
  stick = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function onReport(ev) {
  if (ev.kind === 'answer') return showAnswer(ev);
  if (ev.kind === 'heading') { currentSection = newSection(ev.text || ''); return; }
  addFinding(ev);
}

/* ---------- trace lane ---------- */
function traceMarkdown(ev) {
  if (ev.type === 'tool_call') return `**-> ${ev.name}** \`${JSON.stringify(ev.args || {})}\``;
  if (ev.type === 'tool_result') return `**<- ${ev.name}** - ${ev.summary || ''}`;
  if (ev.type === 'error') return `**Error:** ${ev.text || ''}`;
  return ev.text || '';
}

function onTrace(ev) {
  const md = traceMarkdown(ev);
  if (md) {
    const d = document.createElement('div');
    d.className = 'ev ' + (ev.type || 'trace');
    if (ev.id != null) d.id = 'trace-ev-' + ev.id;  // DOM anchor for U4
    d.innerHTML = marked.parse(md);
    $('trace').appendChild(d);
    $('trace').scrollTop = $('trace').scrollHeight;  // own scroll, even when hidden
  }
  if (ev.type === 'done') $('run').disabled = false;
}

/* ---------- page auto-follow ---------- */
let stick = true;
window.addEventListener('scroll', () => {
  stick = (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 80);
});
function followIfSticking() {
  if (stick) window.scrollTo({ top: document.documentElement.scrollHeight });
}

/* ---------- run ---------- */
function go() {
  if (current) current.close();
  resetReport();
  $('trace').innerHTML = '';
  $('run').disabled = true;
  stick = true;
  current = new EventSource('/run?q=' + encodeURIComponent($('q').value));
  current.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.lane === 'report') onReport(ev);
    else if (ev.lane === 'trace') onTrace(ev);
  };
  current.addEventListener('done', () => { $('run').disabled = false; current.close(); });
  current.onerror = () => { $('run').disabled = false; };
}
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
resetReport();
</script>
