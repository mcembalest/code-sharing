<!doctype html>
<meta charset="utf-8">
<title>Eye on the Monster - live report</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --paper:#ffffff;
    --field:#f6f7f4;
    --line:#cfd5d8;
    --rule:#1c1c1c;
    --ink:#171a1d;
    --muted:#5d6670;
    --accent:#126f83;
    --accent-soft:#e8f3f5;
    --ok:#287a48;
    --warn:#b54708;
    --danger:#b42318;
    --bar-h:56px;
  }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 Arial, Helvetica, sans-serif; margin: 0; color: var(--ink); background: var(--paper); }
  button { font: inherit; border-radius: 2px; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .55; cursor: wait; }

  #bar {
    position: sticky;
    top: 0;
    z-index: 30;
    display: flex;
    gap: .55rem;
    align-items: center;
    min-height: var(--bar-h);
    padding: .55rem 1rem;
    border-bottom: 3px solid var(--accent);
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(12px);
  }
  #brand {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .08em;
    margin-right: .25rem;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #brand::after {
    content: "  \2022  Live report";
    color: var(--muted);
    font-weight: 700;
    letter-spacing: .06em;
  }
  #q {
    flex: 1;
    min-width: 220px;
    max-width: 840px;
    font: inherit;
    padding: .5rem .65rem;
    border: 1px solid #aeb8bd;
    border-radius: 2px;
    background: var(--field);
  }
  #run {
    padding: .5rem .9rem;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: white;
  }
  .ghost {
    padding: .5rem .7rem;
    border: 1px solid #aeb8bd;
    background: #fff;
    color: var(--accent);
  }
  #model {
    font: inherit;
    padding: .45rem .55rem .45rem .6rem;
    border: 1px solid #aeb8bd;
    border-radius: 2px;
    background: var(--field);
    color: var(--ink);
    cursor: pointer;
  }
  #toggle { margin-left: auto; }

  #report {
    max-width: 1080px;
    margin: 0 auto;
    padding: 1.35rem 2.4rem 6rem;
  }

  #status {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    gap: .75rem;
    align-items: center;
    min-height: 40px;
    padding: .45rem 0 .65rem;
    color: var(--muted);
    border-bottom: 2px solid transparent;
  }
  #status[hidden] { display: none; }
  #status.running { border-color: var(--accent); }
  #status.done { color: var(--ok); }
  #status.error { color: var(--danger); }
  #pulse {
    width: 9px;
    height: 9px;
    border-radius: 999px;
    background: var(--muted);
  }
  #status.running #pulse {
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(31,122,140,.4);
    animation: pulse 1.4s ease-out infinite;
  }
  #status.done #pulse { background: var(--ok); }
  #status.error #pulse { background: var(--danger); }
  #status-text, #tool-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tool-text { font-size: 12px; }
  #progress {
    grid-column: 1 / -1;
    width: 100%;
    height: 3px;
    overflow: hidden;
    background: #e7ebed;
    border-radius: 999px;
  }
  #progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width .25s ease;
  }
  #status.running.active #progress-bar {
    background: linear-gradient(90deg, var(--accent), #59a5a0, var(--accent));
  }
  @keyframes pulse {
    70% { box-shadow: 0 0 0 8px rgba(31,122,140,0); }
    100% { box-shadow: 0 0 0 0 rgba(31,122,140,0); }
  }

  #answer-slot {
    background: linear-gradient(180deg, #f7fbfb 0%, #fff 100%);
    border-top: 3px solid var(--accent);
    border-bottom: 1px solid var(--line);
    padding: 1.05rem 1rem 1.2rem;
    margin: 1.15rem -1rem 1.85rem;
  }
  #answer-slot[hidden] { display: none; }
  .answer-label {
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 800;
    margin-bottom: .45rem;
  }
  #answer-slot p { font-size: 17px; line-height: 1.45; margin: .35rem 0; }
  #answer-slot > :last-child { margin-bottom: 0; }

  summary { cursor: pointer; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  .section > summary::before, .supporting > summary::before { content: "\25B8\00a0"; color: var(--muted); }
  .section[open] > summary::before, .supporting[open] > summary::before { content: "\25BE\00a0"; }
  .section > summary {
    font-size: 1.22rem;
    font-weight: 800;
    margin: 1.8rem 0 .65rem;
    padding: .35rem 0 .45rem;
    border-top: 2px solid var(--rule);
    border-bottom: 1px solid var(--line);
  }
  #sections > .section:first-child > summary { margin-top: .35rem; }

  .supporting { margin: .75rem 0 .3rem; }
  .supporting[hidden] { display: none; }
  .supporting > summary {
    display: inline-flex;
    align-items: center;
    color: var(--muted);
    font-size: 12.5px;
    padding: .2rem 0;
  }
  .sup-body {
    display: grid;
    gap: .65rem;
    padding: .55rem 0 0;
    margin-top: .35rem;
    border-top: 1px solid var(--line);
  }
  .sup-body .finding {
    padding: .6rem 0;
    border-top: 1px solid #e2e7ee;
    background: #fff;
  }
  .sup-body blockquote {
    background: transparent;
    font-size: 13px;
    margin: 0;
  }
  .sup-body figure {
    display: inline-block;
    margin: .1rem .6rem .2rem 0;
    vertical-align: top;
  }
  .sup-body figure img { max-width: 240px; }

  .primary { display: grid; gap: .85rem; }
  .finding { scroll-margin-top: calc(var(--bar-h) + 16px); }
  .primary-finding {
    padding: .8rem .85rem 1rem;
    border-top: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    background: #fbfdfd;
  }
  .primary-finding::before {
    content: "Primary";
    display: inline-block;
    margin-bottom: .35rem;
    color: var(--accent);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .primary-finding figure { margin-top: .15rem; }
  blockquote {
    margin: 0;
    padding: .15rem 0;
    color: var(--ink);
    background: #fff;
  }
  blockquote p { margin: .35rem 0; }
  blockquote .cite {
    display: block;
    color: var(--accent);
    font-size: 12px;
    margin-top: .4rem;
  }
  figure { margin: 1rem 0; }
  figure img {
    display: block;
    max-width: 100%;
    border: 1px solid #b7bec3;
    background: #fff;
  }
  figcaption { font-size: 12px; color: var(--muted); margin-top: .4rem; }
  .ai-label {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
    color: #6b5b00;
    background: #fff6d6;
    border: 1px solid #e6d68a;
    border-radius: 3px;
    padding: 0 4px;
    margin-right: .35rem;
  }
  .finding-meta {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
    align-items: center;
    margin-top: .5rem;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    max-width: 100%;
    padding: .12rem .35rem;
    border: 1px solid #b8c5ca;
    border-radius: 2px;
    background: #fff;
    color: var(--accent);
    font-size: 11px;
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  button.chip { cursor: pointer; }
  button.chip:hover { border-color: var(--accent); background: var(--accent-soft); }
  .chip.missing { color: var(--warn); border-color: #f1c79f; }

  #trace {
    position: fixed;
    top: var(--bar-h);
    right: 0;
    bottom: 0;
    width: min(440px, 100%);
    background: #f4f5f2;
    border-top: 3px solid var(--accent);
    overflow: hidden;
    font-size: 12px;
    transform: translateX(100%);
    transition: transform .18s ease;
    box-shadow: -8px 0 24px rgba(0,0,0,.08);
    z-index: 20;
    display: flex;
    flex-direction: column;
  }
  body.trace-open #trace { transform: translateX(0); }
  #trace-cost {
    flex: 0 0 auto;
    padding: .7rem .85rem;
    background: #1b2227;
    color: #e9ecef;
    border-bottom: 2px solid var(--accent);
    font-variant-numeric: tabular-nums;
  }
  #trace-cost .cost-big {
    font-size: 19px;
    font-weight: 700;
    letter-spacing: .01em;
  }
  #trace-cost .cost-big.estimate::after {
    content: " est";
    font-size: 10px;
    font-weight: 600;
    color: #8a949c;
    text-transform: uppercase;
  }
  #trace-cost .cost-meta {
    margin-top: .25rem;
    color: #aab2b8;
    font-size: 11px;
    display: flex;
    gap: .9rem;
    flex-wrap: wrap;
  }
  #trace-cost .cost-meta b { color: #e9ecef; font-weight: 600; }
  #trace-list { flex: 1 1 auto; overflow: auto; padding: .85rem; }
  /* Turn card: groups one model decision (thought + tool calls) with the tool results it triggered.
     The header carries the usage telemetry that previously lived in its own row. */
  .turn-card {
    border: 1px solid var(--line);
    border-radius: 6px;
    margin: .6rem 0;
    background: #fff;
    overflow: hidden;
  }
  .turn-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: .75rem;
    padding: .4rem .7rem;
    background: #f6f7f8;
    border-bottom: 1px solid var(--line);
    color: #5d6670;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .turn-header .turn-label { font-weight: 600; color: #2f3640; }
  .turn-header .turn-stats { color: #5d6670; }
  .turn-header .turn-cost { color: var(--accent); font-weight: 600; }
  .turn-header.pending .turn-stats::before { content: '…'; color: #b5bcc2; }
  .turn-body { padding: .35rem .75rem .5rem; }
  .turn-body .ev {
    border: none;
    padding: .22rem 0;
    margin: 0;
    background: transparent;
    overflow-wrap: anywhere;
    font-size: 13px;
  }
  .turn-body .ev.thought { color: var(--muted); }
  .turn-body .ev.tool_call { color: #2f3640; }
  .turn-body .ev.tool_result { color: #4a6b54; }
  .turn-body .ev :first-child { margin-top: 0; }
  .turn-body .ev :last-child { margin-bottom: 0; }
  /* Standalone events that fall outside a turn card (done/error). */
  .ev.standalone {
    border-top: 1px solid var(--line);
    padding: .55rem 0;
    background: #fff;
    overflow-wrap: anywhere;
  }
  .ev.standalone.done { border-color: var(--ok); }
  .ev.standalone.error { border-color: var(--danger); color: var(--danger); }
  .turn-card.flash, .ev.flash { animation: flash 1.2s ease; }
  @keyframes flash {
    0% { background: #fff4cf; }
    100% { background: #fff; }
  }

  @media (max-width: 820px) {
    #bar { flex-wrap: wrap; }
    #brand { width: 100%; }
    #q { min-width: 0; flex-basis: 100%; }
    #toggle { margin-left: 0; }
    #report { padding: 1rem 1rem 5rem; }
    #status { grid-template-columns: auto minmax(0, 1fr); }
    #tool-text { grid-column: 2; }
    #trace { width: 100%; }
    .primary-finding { padding: .65rem .7rem; }
    #answer-slot { margin-left: 0; margin-right: 0; }
  }
  /* Clarification banner — only shown when the agent calls ask_user. Sits between the input bar
     and the report; muted amber so it reads as "needs your input" without alarming. */
  #ask-banner {
    display: none;
    margin: .55rem 1rem 0;
    padding: .7rem .9rem;
    border: 1px solid #e0c98a;
    border-left: 3px solid #c89841;
    background: #fdf6e3;
    border-radius: 5px;
    font-size: 13px;
    color: #4a3f1d;
  }
  #ask-banner.show { display: block; }
  #ask-banner .ask-q { font-weight: 600; margin-bottom: .25rem; color: #2f2611; }
  #ask-banner .ask-why { color: #6e5d2f; font-size: 12px; }
  #ask-banner .ask-hint { color: #8a7644; font-size: 11px; margin-top: .35rem; font-style: italic; }

  /* Clickable [p. N] citations. Every page reference in a finding, caption, or answer becomes a
     button that opens the rendered monster-PDF page in the viewer. */
  .pageref {
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
    border-bottom: 1px dotted var(--accent);
    white-space: nowrap;
  }
  .pageref:hover { background: var(--accent-soft); }
  blockquote .cite .pageref { border-bottom: none; }
  figure img { cursor: zoom-in; }

  /* Stop button — visible only while a run is in flight. */
  #stop {
    padding: .5rem .8rem;
    border: 1px solid var(--danger);
    background: #fff;
    color: var(--danger);
  }
  #stop[hidden] { display: none; }

  /* Recent-queries menu */
  #recents-wrap { position: relative; }
  #recents-menu {
    position: absolute;
    top: calc(100% + 4px);
    right: 0;
    min-width: 320px;
    max-width: 460px;
    max-height: 60vh;
    overflow: auto;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 8px 28px rgba(0,0,0,.16);
    z-index: 40;
    padding: .3rem;
  }
  #recents-menu[hidden] { display: none; }
  #recents-menu .recent-empty { padding: .6rem .7rem; color: var(--muted); font-size: 12px; }
  #recents-menu button.recent {
    display: block;
    width: 100%;
    text-align: left;
    border: none;
    background: #fff;
    padding: .5rem .6rem;
    border-radius: 3px;
    color: var(--ink);
    white-space: normal;
    line-height: 1.35;
  }
  #recents-menu button.recent:hover { background: var(--field); }
  #recents-menu button.recent .recent-q { font-size: 13px; }
  #recents-menu button.recent .recent-meta { font-size: 11px; color: var(--muted); margin-top: .15rem; }

  /* Page viewer modal — opens the actual monster PDF page behind a citation. */
  #viewer {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    flex-direction: column;
    background: rgba(15,20,24,.82);
    backdrop-filter: blur(3px);
  }
  #viewer[hidden] { display: none; }
  #viewer-bar {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .55rem .9rem;
    background: #1b2227;
    color: #e9ecef;
    border-bottom: 2px solid var(--accent);
    flex: 0 0 auto;
  }
  #viewer-bar .vtitle { font-weight: 700; letter-spacing: .04em; }
  #viewer-bar .vspacer { flex: 1; }
  #viewer-bar button {
    border: 1px solid #3a454c;
    background: #2a333a;
    color: #e9ecef;
    padding: .4rem .7rem;
  }
  #viewer-bar button:hover:not(:disabled) { border-color: var(--accent); }
  #viewer-bar #v-pagenum {
    width: 4.5rem;
    text-align: center;
    background: #11171b;
    border: 1px solid #3a454c;
    color: #e9ecef;
    border-radius: 2px;
    padding: .35rem;
    font: inherit;
  }
  #viewer-bar .v-open { color: #9fe0ec; text-decoration: none; align-self: center; font-size: 12px; }
  #viewer-scroll { flex: 1 1 auto; overflow: auto; display: flex; justify-content: center; padding: 1.2rem; }
  #viewer-img {
    max-width: min(1000px, 100%);
    height: max-content;
    align-self: flex-start;
    background: #fff;
    box-shadow: 0 6px 30px rgba(0,0,0,.4);
    transition: opacity .12s ease;
  }
  #viewer-img.loading { opacity: .35; }
  @media (max-width: 820px) {
    #recents-menu { min-width: 78vw; right: -1rem; }
  }
</style>

<div id="bar">
  <div id="brand">Eye on the Monster</div>
  <input id="q" placeholder="Ask about the corpus">
  <select id="model" aria-label="Agent model">
    <option value="haiku">Haiku 4.5</option>
    <option value="sonnet" selected>Sonnet 4.6</option>
    <option value="opus">Opus 4.8</option>
  </select>
  <button id="run" onclick="go()">Run</button>
  <button id="stop" hidden onclick="stopRun()" title="Stop this run (Esc)">Stop</button>
  <button id="new" class="ghost" onclick="newSearch()" title="Clear and start fresh">New</button>
  <div id="recents-wrap">
    <button id="recents-btn" class="ghost" aria-expanded="false" onclick="toggleRecents()" title="Recent queries">Recent &#9662;</button>
    <div id="recents-menu" hidden></div>
  </div>
  <button id="download-pdf" class="ghost" disabled>Download PDF</button>
  <button id="toggle" class="ghost" aria-expanded="false">Agent trace &#9656;</button>
</div>

<div id="ask-banner" role="status" aria-live="polite"></div>
<main id="report"></main>
<aside id="trace" aria-label="Agent trace">
  <div id="trace-cost">
    <div class="cost-big" id="cost-big">$0.0000</div>
    <div class="cost-meta">
      <span><b id="cost-turns">0</b> turns</span>
      <span><b id="cost-tokens">0</b> tokens</span>
      <span><b id="cost-elapsed">0.0s</b> elapsed</span>
    </div>
  </div>
  <div id="trace-list"></div>
</aside>

<div id="viewer" hidden role="dialog" aria-modal="true" aria-label="Monster PDF page viewer">
  <div id="viewer-bar">
    <span class="vtitle">Eye on the Monster</span>
    <button id="v-prev" title="Previous page (&larr;)">&larr; Prev</button>
    <input id="v-pagenum" type="number" min="1" inputmode="numeric" aria-label="Page number">
    <button id="v-next" title="Next page (&rarr;)">Next &rarr;</button>
    <button id="v-zoom" title="Toggle zoom">Zoom +</button>
    <a id="v-open" class="v-open" target="_blank" rel="noopener">Open image &#8599;</a>
    <span class="vspacer"></span>
    <button id="v-close" title="Close (Esc)">Close &times;</button>
  </div>
  <div id="viewer-scroll"><img id="viewer-img" alt=""></div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = text => String(text ?? '').replace(/[&<>"']/g, ch => (
  { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]
));

let current = null;
let answerSlot, sectionsEl, statusEl, currentSection;
let sectionStates = [];
let answerText = '';
let reportEvents = [];
let traceEvents = [];
let costTurns = 0, costTokens = 0, costElapsedTimer = null, runStartMs = 0;

function fmtCost(usd) {
  if (!usd) return '$0.0000';
  return usd < 1 ? '$' + usd.toFixed(4) : '$' + usd.toFixed(2);
}
function fmtNum(n) { return Number(n || 0).toLocaleString(); }
function fmtMs(ms) {
  if (ms == null) return '';
  return ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : Math.round(ms) + 'ms';
}

function resetCostPanel() {
  costTurns = 0; costTokens = 0; runStartMs = Date.now();
  $('cost-big').textContent = '$0.0000';
  $('cost-big').classList.add('estimate');
  $('cost-turns').textContent = '0';
  $('cost-tokens').textContent = '0';
  $('cost-elapsed').textContent = '0.0s';
  if (costElapsedTimer) clearInterval(costElapsedTimer);
  costElapsedTimer = setInterval(() => {
    $('cost-elapsed').textContent = ((Date.now() - runStartMs) / 1000).toFixed(1) + 's';
  }, 100);
}

function updateCostPanel(ev) {
  if (ev.type === 'usage') {
    costTurns += 1;
    costTokens += (ev.input_tokens || 0) + (ev.output_tokens || 0)
      + (ev.cache_read_tokens || 0) + (ev.cache_write_tokens || 0);
    // Live figure is a LOWER-BOUND estimate: per-turn output_tokens arrive stubbed (~1) and the real
    // output only lands at `done`, so prefix '~' to signal it will firm up (and rise) on completion.
    $('cost-big').textContent = '~' + fmtCost(ev.cost_total);
    $('cost-big').classList.add('estimate');
    $('cost-turns').textContent = fmtNum(costTurns);
    $('cost-tokens').textContent = fmtNum(costTokens);
  }
  if (ev.type === 'done') {
    if (costElapsedTimer) { clearInterval(costElapsedTimer); costElapsedTimer = null; }
    // Reconcile to the SDK's authoritative totals: exact billed cost and real token count (which
    // includes the output our live snapshots stubbed). Drop the '~' — this is the real number now.
    if (ev.cost_total != null) $('cost-big').textContent = fmtCost(ev.cost_total);
    if (ev.total_tokens) $('cost-tokens').textContent = fmtNum(ev.total_tokens);
    $('cost-big').classList.remove('estimate');
    // Intentionally not reconciling cost-turns to ev.num_turns: the SDK counts every message
    // (assistant + tool_result), while the trace cards count model decisions. Keep them aligned.
    if (ev.duration_ms != null) $('cost-elapsed').textContent = fmtMs(ev.duration_ms);
    // Resolve any turn card whose usage snapshot never arrived (e.g. the final answer turn): its
    // cost is folded into the authoritative total above, so retire the "awaiting usage" placeholder.
    document.querySelectorAll('.turn-header.pending').forEach(h => {
      h.classList.remove('pending');
      const stats = h.querySelector('.turn-stats');
      if (stats && /awaiting usage/.test(stats.textContent)) stats.textContent = 'usage in run total';
    });
  }
}
let currentTool = '';
let coverage = null;
let stick = true;
let runFinished = false;
let progressPct = 0;
// Trace turn-card grouping state. A "turn" = one model decision (thought + tool_calls) plus the
// tool_results that follow it. We open a new card when a thought/tool_call arrives after a
// usage/done boundary; the usage event fills the card header (it arrives at the END of the
// model's emission, so we render a placeholder header and patch it when usage lands).
let currentCard = null;       // { el, body, headerEl, num }
let currentTurnNum = 0;
let nextEventStartsCard = true;

function syncBarHeight() {
  document.documentElement.style.setProperty('--bar-h', $('bar').offsetHeight + 'px');
}
window.addEventListener('resize', syncBarHeight);
syncBarHeight();

function setTrace(open) {
  document.body.classList.toggle('trace-open', open);
  $('toggle').innerHTML = 'Agent trace ' + (open ? '▾' : '▸');
  $('toggle').setAttribute('aria-expanded', String(open));
  localStorage.setItem('traceOpen', open ? '1' : '0');
  syncBarHeight();
}
$('toggle').onclick = () => setTrace(!document.body.classList.contains('trace-open'));
setTrace(localStorage.getItem('traceOpen') === '1');

// Hydrate the model dropdown from the last user choice (persisted in go()).
(function hydrateModel() {
  const sel = $('model');
  if (!sel) return;
  let saved = '';
  try { saved = localStorage.getItem('agentModel') || ''; } catch (_) {}
  if (saved && [...sel.options].some(o => o.value === saved)) sel.value = saved;
  sel.addEventListener('change', () => {
    try { localStorage.setItem('agentModel', sel.value); } catch (_) {}
  });
})();

function resetReport() {
  $('report').innerHTML = '';
  statusEl = document.createElement('div');
  statusEl.id = 'status';
  statusEl.hidden = true;
  statusEl.innerHTML = `
    <div id="pulse"></div>
    <div id="status-text">Idle</div>
    <div id="tool-text"></div>
    <div id="progress"><div id="progress-bar"></div></div>
  `;
  answerSlot = document.createElement('div');
  answerSlot.id = 'answer-slot';
  answerSlot.hidden = true;
  sectionsEl = document.createElement('div');
  sectionsEl.id = 'sections';
  $('report').append(statusEl, answerSlot, sectionsEl);
  currentSection = null;
  sectionStates = [];
  answerText = '';
  reportEvents = [];
  coverage = null;
  progressPct = 0;
  setExportEnabled(false);
}

function setExportEnabled(enabled) {
  $('download-pdf').disabled = !enabled;
}

function setStatus(state, text, toolText = '') {
  statusEl.hidden = false;
  statusEl.className = [state || '', state === 'running' && progressPct > 0 ? 'active' : ''].filter(Boolean).join(' ');
  $('status-text').textContent = text;
  $('tool-text').textContent = toolText;
}

function setProgress(pct) {
  progressPct = Math.max(0, Math.min(100, Number(pct) || 0));
  $('progress-bar').style.width = progressPct + '%';
  if (!statusEl.hidden && statusEl.classList.contains('running')) statusEl.classList.add('active');
}

function bumpProgress(delta = 6) {
  if (progressPct >= 92) return;
  const eased = progressPct + ((92 - progressPct) * 0.12);
  setProgress(Math.max(progressPct + delta, eased));
}

function updateProgressFromSummary(summary) {
  const m = String(summary || '').match(/(\d+)\/(\d+)\s+inspected/i);
  if (!m) return;
  coverage = { inspected: Number(m[1]), total: Number(m[2]) };
  const pct = coverage.total ? Math.round((coverage.inspected / coverage.total) * 100) : 0;
  setProgress(pct);
  setStatus('running', `Inspected ${coverage.inspected}/${coverage.total} issues`, currentTool ? `Current tool: ${currentTool}` : '');
}

function updateProgressFromTrace(ev) {
  if (ev.type === 'tool_call') {
    bumpProgress(3);
    return;
  }
  if (ev.type !== 'tool_result') return;

  if (String(ev.summary || '').match(/(\d+)\/(\d+)\s+inspected/i)) {
    updateProgressFromSummary(ev.summary);
    return;
  }
  if (ev.name === 'enumerate' && ev.coverage_total != null) {
    const surfaced = Number(ev.surfaced || 0);
    const total = Number(ev.coverage_total || 0);
    const pct = total ? Math.round((surfaced / total) * 100) : progressPct;
    setProgress(Math.max(progressPct, Math.min(88, pct)));
    setStatus('running', `Enumerated ${fmtNum(surfaced)}/${fmtNum(total)} tagged pages`, currentTool ? `Current tool: ${currentTool}` : '');
    return;
  }
  bumpProgress(5);
}

function newSection(title) {
  const sec = document.createElement('details');
  sec.className = 'section';
  sec.open = true;

  const sum = document.createElement('summary');
  sum.innerHTML = title ? marked.parseInline(title) : 'Findings';
  const primary = document.createElement('div');
  primary.className = 'primary';

  const sup = document.createElement('details');
  sup.className = 'supporting';
  sup.hidden = true;
  const supSum = document.createElement('summary');
  const supBody = document.createElement('div');
  supBody.className = 'sup-body';
  sup.append(supSum, supBody);

  sec.append(sum, primary, sup);
  sectionsEl.appendChild(sec);

  const state = { title: title || 'Findings', primary: [], supporting: [], el: sec };
  sec._state = state;
  sec._primary = primary;
  sec._sup = sup;
  sec._supBody = supBody;
  sec._supSummary = supSum;
  sec._supCount = 0;
  sectionStates.push(state);
  return sec;
}

function ensureSection() {
  if (!currentSection) currentSection = newSection(null);
  return currentSection;
}

function citeText(ev) {
  return `${ev.title || ''}${ev.issue_date ? ', ' + ev.issue_date : ''} [p. ${ev.page}]`.trim();
}

function findingHtml(ev) {
  if (ev.kind === 'quote') {
    return `<blockquote>${marked.parse(ev.text || '')}<span class="cite">${esc(citeText(ev))}</span></blockquote>`;
  }
  if (ev.kind === 'chart') {
    const caption = `${ev.caption || 'Chart'} [p. ${ev.page}]`;
    return `<figure><img src="/page_image/${encodeURIComponent(ev.page)}" data-page="${esc(ev.page)}" loading="lazy" alt="Page ${esc(ev.page)} chart" title="Click to open page ${esc(ev.page)}"><figcaption><span class="ai-label">AI chart description</span> ${esc(caption)}</figcaption></figure>`;
  }
  return marked.parse(ev.text || '');
}

function addProvenanceChip(node, src) {
  if (!src) return;
  const meta = document.createElement('div');
  meta.className = 'finding-meta';
  const chip = document.createElement('button');
  chip.type = 'button';
  chip.className = 'chip';
  chip.textContent = src;
  chip.title = 'Open source trace event';
  chip.onclick = () => openTraceForSource(src, chip);
  meta.appendChild(chip);
  node.appendChild(meta);
}

function addFinding(ev) {
  const sec = ensureSection();
  const supporting = (ev.kind === 'quote' || ev.kind === 'chart') && ev.relevance === 'supporting';
  const node = document.createElement('article');
  node.className = 'finding ' + (supporting ? 'supporting-finding' : 'primary-finding');
  node.innerHTML = findingHtml(ev);
  wirePageLinks(node);
  if (ev.src) node.dataset.src = ev.src;
  addProvenanceChip(node, ev.src);

  if (supporting) {
    sec._supBody.appendChild(node);
    sec._supCount++;
    sec._state.supporting.push(ev);
    sec._supSummary.textContent = `${sec._supCount} supporting finding${sec._supCount === 1 ? '' : 's'}`;
    sec._sup.hidden = false;
  } else {
    sec._primary.appendChild(node);
    sec._state.primary.push(ev);
  }
  reportEvents.push(ev);
  setExportEnabled(true);
  followIfSticking();
}

function showAnswer(ev) {
  answerText = ev.text || '';
  answerSlot.innerHTML = '<div class="answer-label">Answer</div>' + marked.parse(answerText);
  wirePageLinks(answerSlot);
  answerSlot.hidden = false;
  reportEvents.push(ev);
  setExportEnabled(true);
  stick = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function onReport(ev) {
  setExportEnabled(true);
  if (ev.kind === 'answer') return showAnswer(ev);
  if (ev.kind === 'heading') {
    currentSection = newSection(ev.text || '');
    reportEvents.push(ev);
    return;
  }
  addFinding(ev);
}

function normalizeToolName(name) {
  return String(name || '').replace(/^mcp__eom__/, '');
}

function traceMarkdown(ev) {
  const name = normalizeToolName(ev.name);
  if (ev.type === 'tool_call') return `**→ ${name}** \`${JSON.stringify(ev.args || {})}\``;
  if (ev.type === 'tool_result') return `**← ${name}** - ${ev.summary || ''}`;
  if (ev.type === 'error') return `**Error:** ${ev.text || ''}`;
  if (ev.type === 'done') return ev.is_error ? '**Run ended with errors.**' : '**Run complete.**';
  return ev.text || '';
}

// Render the turn-card header content from a usage event. Pulls cost/latency/tokens/cache out of
// the usage event so it can live in the card header instead of as its own row.
function turnHeaderHTML(turnNum, ev) {
  if (!ev) {
    return `<span class="turn-label">Turn #${turnNum}</span><span class="turn-stats">awaiting usage</span>`;
  }
  const ctx = ev.context_tokens != null ? ev.context_tokens
    : (ev.input_tokens || 0) + (ev.cache_read_tokens || 0) + (ev.cache_write_tokens || 0);
  const latency = ev.latency_ms != null ? `${fmtMs(ev.latency_ms)} · ` : '';
  const io = `${fmtNum(ctx)} ctx / ${fmtNum(ev.output_tokens)} out`;
  const cache = (ev.cache_read_tokens || ev.cache_write_tokens)
    ? ` · cache ${fmtNum(ev.cache_read_tokens)}r/${fmtNum(ev.cache_write_tokens)}w` : '';
  const stats = `${latency}${io}${cache} · <span class="turn-cost">+${fmtCost(ev.turn_cost)}</span> (Σ ${fmtCost(ev.cost_total)})`;
  return `<span class="turn-label">Turn #${turnNum}</span><span class="turn-stats">${stats}</span>`;
}

function sourceParts(src) {
  const raw = String(src || '').trim();
  const idx = raw.indexOf(':');
  if (idx >= 0) return { name: normalizeToolName(raw.slice(0, idx)), detail: raw.slice(idx + 1) };
  const parts = raw.split(/\s+/, 2);
  return { name: normalizeToolName(parts[0]), detail: raw.slice(parts[0].length).trim() };
}

function findTraceForSource(src) {
  const { name, detail } = sourceParts(src);
  const candidates = traceEvents.filter(ev => normalizeToolName(ev.name) === name);
  if (!candidates.length) return null;
  const tokens = detail.toLowerCase().replace(/['"]/g, '').split(/[,\s]+/).filter(t => t.length > 2);
  if (!tokens.length) return candidates[candidates.length - 1];
  let best = null;
  let bestScore = 0;
  for (const ev of candidates) {
    const hay = JSON.stringify(ev.args || {}).toLowerCase() + ' ' + String(ev.summary || ev.text || '').toLowerCase();
    const score = tokens.reduce((n, t) => n + (hay.includes(t) ? 1 : 0), 0);
    if (score > bestScore) {
      best = ev;
      bestScore = score;
    }
  }
  return best || candidates[candidates.length - 1];
}

function openTraceForSource(src, chip) {
  const ev = findTraceForSource(src);
  setTrace(true);
  requestAnimationFrame(() => {
    if (!ev || !ev.el) {
      chip.classList.add('missing');
      chip.title = 'No matching trace event found yet';
      return;
    }
    chip.classList.remove('missing');
    ev.el.scrollIntoView({ block: 'center' });
    ev.el.classList.remove('flash');
    void ev.el.offsetWidth;
    ev.el.classList.add('flash');
  });
}

function onAsk(ev) {
  // The agent decided clarifying would materially help. Surface the question above the report
  // and focus the search input so the user can refine + re-run. We do NOT auto-edit their query
  // — they may want to scrap it entirely.
  const banner = $('ask-banner');
  const why = ev.why ? `<div class="ask-why">${esc(ev.why)}</div>` : '';
  banner.innerHTML =
    `<div class="ask-q">${esc(ev.question || 'Clarification needed')}</div>` +
    why +
    `<div class="ask-hint">Refine your query above and click Run again.</div>`;
  banner.classList.add('show');
  $('q').focus();
  $('q').select();
}

function openTurnCard() {
  currentTurnNum += 1;
  const card = document.createElement('div');
  card.className = 'turn-card';
  const headerEl = document.createElement('div');
  headerEl.className = 'turn-header pending';
  headerEl.innerHTML = turnHeaderHTML(currentTurnNum, null);
  const body = document.createElement('div');
  body.className = 'turn-body';
  card.appendChild(headerEl);
  card.appendChild(body);
  $('trace-list').appendChild(card);
  currentCard = { el: card, body, headerEl, num: currentTurnNum };
  return currentCard;
}

function appendEventRow(ev, parent) {
  const md = traceMarkdown(ev);
  if (!md) return null;
  const d = document.createElement('div');
  d.className = 'ev ' + (ev.type || 'trace');
  if (ev.id != null) d.id = 'trace-ev-' + ev.id;
  d.innerHTML = marked.parse(md);
  parent.appendChild(d);
  return d;
}

function onTrace(ev) {
  updateCostPanel(ev);
  let elForEvent = null;
  if (ev.type === 'usage') {
    // Usage fires at the END of an AssistantMessage; the card is already open and accumulating
    // events from that same model turn. Patch its header in place.
    if (!currentCard) openTurnCard();
    currentCard.headerEl.classList.remove('pending');
    currentCard.headerEl.innerHTML = turnHeaderHTML(currentCard.num, ev);
    elForEvent = currentCard.headerEl;
    // Tool_results that arrive after usage still belong to THIS card (they're the results of this
    // turn's calls). The next thought/tool_call signals a new model decision → new card.
    nextEventStartsCard = true;
  } else if (ev.type === 'thought' || ev.type === 'tool_call') {
    if (nextEventStartsCard || !currentCard) openTurnCard();
    nextEventStartsCard = false;
    elForEvent = appendEventRow(ev, currentCard.body);
  } else if (ev.type === 'tool_result') {
    if (!currentCard) openTurnCard();
    elForEvent = appendEventRow(ev, currentCard.body);
  } else if (ev.type === 'done' || ev.type === 'error') {
    const md = traceMarkdown(ev);
    if (md) {
      const d = document.createElement('div');
      d.className = 'ev standalone ' + ev.type;
      if (ev.id != null) d.id = 'trace-ev-' + ev.id;
      d.innerHTML = marked.parse(md);
      $('trace-list').appendChild(d);
      elForEvent = d;
    }
  } else {
    // Unknown event types fall through into the current card body so we never silently drop them.
    if (!currentCard) openTurnCard();
    elForEvent = appendEventRow(ev, currentCard.body);
  }
  if (elForEvent) {
    ev.el = elForEvent;
    traceEvents.push(ev);
    $('trace-list').scrollTop = $('trace-list').scrollHeight;
  }
  if (ev.type === 'tool_call') {
    currentTool = normalizeToolName(ev.name);
    setStatus('running', coverage ? `Inspected ${coverage.inspected}/${coverage.total} issues` : 'Running', `Current tool: ${currentTool}`);
  }
  updateProgressFromTrace(ev);
  if (ev.type === 'done') {
    setRunning(false);
    const label = ev.is_error ? 'Run ended with errors' : 'Run complete';
    setStatus(ev.is_error ? 'error' : 'done', label, coverage ? `Inspected ${coverage.inspected}/${coverage.total} issues` : '');
    if (!ev.is_error && (!coverage || coverage.total === 0 || coverage.inspected >= coverage.total)) {
      setProgress(100);
    }
  }
  if (ev.type === 'error') {
    setStatus('error', ev.text || 'Error', '');
  }
}

window.addEventListener('scroll', () => {
  stick = (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 80);
});

function followIfSticking() {
  if (stick) window.scrollTo({ top: document.documentElement.scrollHeight });
}

function go() {
  if (current) current.close();
  resetReport();
  $('trace-list').innerHTML = '';
  resetCostPanel();
  traceEvents = [];
  currentTool = '';
  runFinished = false;
  currentCard = null;
  currentTurnNum = 0;
  nextEventStartsCard = true;
  $('ask-banner').classList.remove('show');
  $('ask-banner').innerHTML = '';
  setRunning(true);
  stick = true;
  setStatus('running', 'Starting', '');
  const modelChoice = $('model') ? $('model').value : '';
  if (modelChoice) {
    try { localStorage.setItem('agentModel', modelChoice); } catch (_) {}
  }
  saveRecent($('q').value, modelChoice);
  const modelParam = modelChoice ? ('&model=' + encodeURIComponent(modelChoice)) : '';
  current = new EventSource('/run?q=' + encodeURIComponent($('q').value) + modelParam);
  current.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.lane === 'report') onReport(ev);
    else if (ev.lane === 'trace') onTrace(ev);
    else if (ev.lane === 'ask') onAsk(ev);
  };
  current.addEventListener('done', () => {
    runFinished = true;
    setRunning(false);
    if (current) current.close();
  });
  current.onerror = () => {
    if (runFinished) return;
    setRunning(false);
    setStatus('error', 'Stream disconnected', '');
    if (current) current.close();
  };
}

function quoteMarkdown(text) {
  return String(text || '').trim().split('\n').map(line => `> ${line}`).join('\n');
}

function eventMarkdown(ev) {
  if (ev.kind === 'quote') return `${quoteMarkdown(ev.text)}\n>\n> ${citeText(ev)}`;
  if (ev.kind === 'chart') return `![Chart p. ${ev.page}](/page_image/${ev.page})\n\n*AI chart description: ${ev.caption || 'Chart'} [p. ${ev.page}]*`;
  if (ev.kind === 'narrative') return ev.text || '';
  return '';
}

function buildMarkdown() {
  const lines = [`# Eye on the Monster Report`, '', `Query: ${$('q').value || ''}`, ''];
  if (answerText) lines.push('## Answer', '', answerText.trim(), '');
  for (const sec of sectionStates) {
    lines.push(`## ${sec.title}`, '');
    for (const ev of sec.primary) lines.push(eventMarkdown(ev), '');
    if (sec.supporting.length) {
      lines.push('### Supporting Findings', '');
      for (const ev of sec.supporting) lines.push(eventMarkdown(ev), '');
    }
  }
  return lines.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n';
}

function cleanEvent(ev) {
  const out = {};
  for (const key of ['kind', 'text', 'page', 'issue_date', 'title', 'caption', 'relevance', 'src']) {
    if (ev[key] != null) out[key] = ev[key];
  }
  return out;
}

function buildPdfPayload() {
  return {
    query: $('q').value || '',
    answer: answerText || '',
    sections: sectionStates.map(sec => ({
      title: sec.title,
      primary: sec.primary.map(cleanEvent),
      supporting: sec.supporting.map(cleanEvent),
    })),
  };
}

$('download-pdf').onclick = async () => {
  const button = $('download-pdf');
  const previous = button.textContent;
  button.disabled = true;
  button.textContent = 'Building PDF';
  try {
    const resp = await fetch('/export_pdf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(buildPdfPayload()),
    });
    if (!resp.ok) throw new Error(await resp.text());
    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'eye-on-the-monster-report.pdf';
    document.body.appendChild(a);
    a.click();
    // Defer cleanup: revoking the object URL or removing the anchor on the same tick as click()
    // can cancel the download in Chrome before it starts. Let the download commit first.
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1000);
  } catch (err) {
    console.error(err);
    button.textContent = 'PDF failed';
    setTimeout(() => { button.textContent = previous; }, 1400);
  } finally {
    button.disabled = false;
    if (button.textContent === 'Building PDF') button.textContent = previous;
  }
};

// ---- Run-state toggle: Run disabled + Stop visible only while a run is in flight ----
function setRunning(running) {
  $('run').disabled = running;
  $('stop').hidden = !running;
}

// Stop the current run. Closing the EventSource disconnects the client; the server's streaming
// generator is cancelled on disconnect, so the agent stops doing (and billing) work. close() does
// not fire onerror, so we settle the UI state here.
function stopRun() {
  if (current) { current.close(); current = null; }
  runFinished = true;
  setRunning(false);
  if (costElapsedTimer) { clearInterval(costElapsedTimer); costElapsedTimer = null; }
  $('cost-big').classList.remove('estimate');
  setStatus('done', 'Stopped', 'Run stopped by you — refine and run again, or keep what was found.');
  setProgress(progressPct);
}

// Clear everything and return to a blank slate.
function newSearch() {
  if (current) { current.close(); current = null; }
  runFinished = true;
  setRunning(false);
  resetReport();
  resetCostPanel();
  $('trace-list').innerHTML = '';
  traceEvents = [];
  currentTool = '';
  currentCard = null;
  currentTurnNum = 0;
  nextEventStartsCard = true;
  $('ask-banner').classList.remove('show');
  $('ask-banner').innerHTML = '';
  $('q').value = '';
  $('q').focus();
}

// ---- Clickable [p. N] / [pp. N-M] citations -> page viewer ----
const CITE_RE = /\[pp?\.\s*(\d+)(?:\s*[-–—]\s*(\d+))?\]/g;

function linkifyCitations(root) {
  // Walk text nodes and replace [p. N] / [pp. N-M] with a clickable pageref. Skip anything already
  // interactive (buttons, links, existing pagerefs) so we don't double-wrap.
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(node) {
      if (!node.nodeValue || !/\[pp?\.\s*\d/.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
      const p = node.parentElement;
      if (p && p.closest('a, button, .pageref, code, script')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    },
  });
  const targets = [];
  let n;
  while ((n = walker.nextNode())) targets.push(n);
  for (const textNode of targets) {
    const text = textNode.nodeValue;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    CITE_RE.lastIndex = 0;
    while ((m = CITE_RE.exec(text))) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const pageNum = Number(m[1]);  // capture per-iteration: `m` is reused and is null after the loop
      const span = document.createElement('span');
      span.className = 'pageref';
      span.textContent = m[0];
      span.dataset.page = String(pageNum);
      span.title = 'Open page ' + pageNum + ' in the monster PDF';
      span.onclick = () => openPage(pageNum);
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    textNode.parentNode.replaceChild(frag, textNode);
  }
}

function wirePageLinks(root) {
  linkifyCitations(root);
  // Chart images open the same page they depict.
  root.querySelectorAll('img[data-page]').forEach(img => {
    img.onclick = () => openPage(Number(img.dataset.page));
  });
}

// ---- Page viewer modal ----
let viewerPage = null;
let viewerTotal = null;
let viewerZoom = false;
fetch('/meta').then(r => r.json()).then(d => {
  viewerTotal = Number(d.pages) || null;
  // If the viewer opened before the total arrived, re-evaluate the nav bounds now.
  if (viewerPage && !$('viewer').hidden) showViewerPage(viewerPage);
}).catch(() => {});

function openPage(n) {
  if (!Number.isFinite(n) || n < 1) return;
  $('viewer').hidden = false;
  document.body.style.overflow = 'hidden';
  showViewerPage(n);
}

function showViewerPage(n) {
  if (viewerTotal) n = Math.max(1, Math.min(n, viewerTotal));
  else n = Math.max(1, n);
  viewerPage = n;
  const img = $('viewer-img');
  img.classList.add('loading');
  const dpi = viewerZoom ? 200 : 130;
  img.onload = () => img.classList.remove('loading');
  img.onerror = () => img.classList.remove('loading');
  img.src = `/page_image/${n}?dpi=${dpi}`;
  img.alt = 'Eye on the Monster, page ' + n;
  $('v-pagenum').value = n;
  $('v-open').href = `/page_image/${n}?dpi=220`;
  $('viewer-bar').querySelector('.vtitle').textContent =
    'Eye on the Monster — p. ' + n + (viewerTotal ? ' / ' + viewerTotal : '');
  $('v-prev').disabled = n <= 1;
  // When the page total is unknown (meta fetch slow/failed), disable Next rather than let the user
  // page into a 404 that silently leaves the viewer on the prior page.
  $('v-next').disabled = viewerTotal ? n >= viewerTotal : true;
  $('viewer-scroll').scrollTop = 0;
}

function closeViewer() {
  $('viewer').hidden = true;
  document.body.style.overflow = '';
}

$('v-prev').onclick = () => showViewerPage((viewerPage || 1) - 1);
$('v-next').onclick = () => showViewerPage((viewerPage || 0) + 1);
$('v-close').onclick = closeViewer;
$('v-zoom').onclick = () => {
  viewerZoom = !viewerZoom;
  $('v-zoom').textContent = viewerZoom ? 'Zoom −' : 'Zoom +';
  if (viewerPage) showViewerPage(viewerPage);
};
$('v-pagenum').addEventListener('change', () => {
  const v = Number($('v-pagenum').value);
  if (Number.isFinite(v) && v >= 1) showViewerPage(v);
});
$('viewer').addEventListener('click', e => { if (e.target === $('viewer')) closeViewer(); });

// ---- Recent queries (persisted) ----
const RECENTS_KEY = 'recentQueries';

function loadRecents() {
  try { return JSON.parse(localStorage.getItem(RECENTS_KEY) || '[]'); } catch (_) { return []; }
}

function saveRecent(q, model) {
  q = String(q || '').trim();
  if (!q) return;
  let list = loadRecents().filter(r => r.q !== q);
  list.unshift({ q, model: model || '', ts: Date.now() });
  list = list.slice(0, 25);
  try { localStorage.setItem(RECENTS_KEY, JSON.stringify(list)); } catch (_) {}
}

function fmtAgo(ts) {
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function renderRecents() {
  const menu = $('recents-menu');
  const list = loadRecents();
  if (!list.length) {
    menu.innerHTML = '<div class="recent-empty">No recent queries yet.</div>';
    return;
  }
  menu.innerHTML = '';
  for (const r of list) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'recent';
    b.innerHTML = `<div class="recent-q">${esc(r.q)}</div>` +
      `<div class="recent-meta">${esc(r.model || 'sonnet')} · ${fmtAgo(r.ts)}</div>`;
    b.onclick = () => runRecent(r);
    menu.appendChild(b);
  }
}

function runRecent(r) {
  closeRecents();
  $('q').value = r.q;
  if (r.model && $('model') && [...$('model').options].some(o => o.value === r.model)) {
    $('model').value = r.model;
  }
  go();
}

function toggleRecents() {
  const menu = $('recents-menu');
  if (menu.hidden) {
    renderRecents();
    menu.hidden = false;
    $('recents-btn').setAttribute('aria-expanded', 'true');
  } else {
    closeRecents();
  }
}

function closeRecents() {
  $('recents-menu').hidden = true;
  $('recents-btn').setAttribute('aria-expanded', 'false');
}

document.addEventListener('click', e => {
  if (!$('recents-wrap').contains(e.target)) closeRecents();
});

// ---- Global keyboard: Esc closes viewer/recents or stops a run; arrows page the viewer ----
document.addEventListener('keydown', e => {
  if (!$('viewer').hidden) {
    if (e.key === 'Escape') { closeViewer(); }
    // Don't hijack arrows while the user is typing a page number in the input.
    else if (e.target === $('v-pagenum')) { return; }
    else if (e.key === 'ArrowLeft') { showViewerPage((viewerPage || 1) - 1); }
    else if (e.key === 'ArrowRight') { showViewerPage((viewerPage || 0) + 1); }
    return;
  }
  if (e.key === 'Escape') {
    if (!$('recents-menu').hidden) { closeRecents(); return; }
    if (!$('stop').hidden) { stopRun(); }
  }
});

$('q').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
resetReport();
</script>
