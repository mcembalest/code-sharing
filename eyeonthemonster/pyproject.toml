[project]
name = "eyeonthemonster"
version = "0.1.0"
description = "Agentic search over the Eye on the Monster PDF, with [p. N] citations and a live-trace report UI. See BUILD_BRIEF.md."
requires-python = ">=3.10"
dependencies = [
    # data pipeline + indexing (used by _diag/ and baseline/)
    "pymupdf>=1.24.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "numpy>=2.0.0",
    # vision cards
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.0",
    # agent loop + live UI (BUILD_BRIEF steps 4-5)
    "claude-agent-sdk>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[tool.uv]
package = false
