[project]
name = "eyeonthemonster"
version = "0.1.0"
description = "Agentic search over the Eye on the Monster PDF, with [p. N] citations and a live-trace report UI. See HOW_IT_WORKS.md."
requires-python = ">=3.10"
dependencies = [
    # data pipeline + indexing (used by _diag/ and baseline/)
    "pymupdf>=1.24.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "numpy>=2.0.0",
    # vision cards
    "google-genai>=0.3.0",
    "python-dotenv>=1.0.0",
    # agent loop + live UI
    "claude-agent-sdk>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[tool.uv]
package = false

# Offline analysis only (calibrate.py) — NOT needed by the server/agent at runtime, kept out of the
# Modal image. Run with: uv run --group dev python calibrate.py --calibrate
[dependency-groups]
dev = [
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
]
